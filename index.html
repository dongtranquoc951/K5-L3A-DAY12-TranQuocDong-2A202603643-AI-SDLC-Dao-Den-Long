<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng — 3D Game (Phase 1)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a14;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* HUD Header */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-card {
      background: rgba(14, 18, 36, 0.85);
      border: 1px solid rgba(255, 170, 50, 0.3);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
    }
    .hud-title {
      font-size: 13px;
      color: #ffcc66;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .hud-value {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .flames-icon {
      color: #ff5533;
      text-shadow: 0 0 10px rgba(255, 80, 40, 0.8);
    }

    /* Bottom Control Bar & Instructions */
    #controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 16, 32, 0.8);
      border: 1px solid rgba(255, 200, 100, 0.2);
      border-radius: 24px;
      padding: 10px 24px;
      display: flex;
      gap: 20px;
      font-size: 13px;
      color: #ddd;
      pointer-events: none;
      z-index: 10;
    }
    .key-badge {
      background: rgba(255, 180, 50, 0.25);
      border: 1px solid rgba(255, 180, 50, 0.5);
      border-radius: 6px;
      padding: 2px 7px;
      font-weight: bold;
      color: #ffea88;
    }

    /* Game Over Modal */
    #modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 7, 15, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    .modal-content {
      background: #12182b;
      border: 2px solid #ffaa33;
      border-radius: 16px;
      padding: 32px 48px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(255, 170, 50, 0.3);
    }
    .modal-title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .modal-title.won {
      color: #ffcc33;
      text-shadow: 0 0 15px rgba(255, 200, 50, 0.7);
    }
    .modal-title.lost {
      color: #ff4444;
      text-shadow: 0 0 15px rgba(255, 60, 60, 0.7);
    }
    .modal-desc {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .modal-score {
      font-size: 26px;
      color: #fff;
      font-weight: bold;
      margin-bottom: 24px;
    }
    .btn-restart {
      background: linear-gradient(135deg, #ff9922, #dd6600);
      border: none;
      border-radius: 30px;
      padding: 12px 36px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 120, 0, 0.4);
      transition: all 0.2s ease;
      pointer-events: auto;
    }
    .btn-restart:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 22px rgba(255, 150, 0, 0.6);
    }
  </style>
  <script src="src/render/three.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <div class="hud-title">Sinh lực (Ngọn lửa)</div>
      <div class="hud-value" id="hud-flames">
        <span class="flames-icon">🔥🔥🔥</span>
      </div>
    </div>

    <div class="hud-card">
      <div class="hud-title">Đom đóm mang theo</div>
      <div class="hud-value" id="hud-carried">
        <span>🏮 0 / 5</span>
      </div>
    </div>

    <div class="hud-card">
      <div class="hud-title">Đèn Lồng Đã Thắp</div>
      <div class="hud-value" id="hud-lanterns">
        <span>0 / 5</span>
      </div>
    </div>

    <div class="hud-card">
      <div class="hud-title">Thời Gian & Điểm</div>
      <div class="hud-value" id="hud-time-score">
        <span style="font-size: 18px; color: #88ccff;" id="hud-time">180s</span>
        <span style="font-size: 16px; color: #ffcc55; margin-left: 12px;" id="hud-score">0 pts</span>
      </div>
    </div>
  </div>

  <!-- Controls Reminder -->
  <div id="controls-hint">
    <div><span class="key-badge">WASD</span> Di chuyển</div>
    <div><span class="key-badge">E</span> Nạp đom đóm vào Đèn</div>
    <div><span class="key-badge">Q</span> / <span class="key-badge">F</span> Tỏa sáng (xua Bóng Mực)</div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div class="modal-content">
      <div class="modal-title" id="modal-title">Chiến Thắng!</div>
      <div class="modal-desc" id="modal-desc">Bạn đã thắp sáng toàn bộ 5 Đèn Lồng Lớn trên Đảo Bến!</div>
      <div class="modal-score" id="modal-score">Điểm: 0</div>
      <button class="btn-restart" id="btn-restart">Chơi Lại</button>
    </div>
  </div>

  <script type="module">
    import { Game3D } from './src/render/game3d.js';

    const container = document.getElementById('game-container');
    const game = new Game3D(container);
    game.start();

    // Elements
    const elFlames = document.getElementById('hud-flames');
    const elCarried = document.getElementById('hud-carried');
    const elLanterns = document.getElementById('hud-lanterns');
    const elTime = document.getElementById('hud-time');
    const elScore = document.getElementById('hud-score');
    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalScore = document.getElementById('modal-score');
    const btnRestart = document.getElementById('btn-restart');

    btnRestart.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
      game.restart();
    });

    // Sync HUD with engine state
    setInterval(() => {
      if (!game || !game.engine) return;

      const engine = game.engine;
      // Flames
      let flameText = '';
      for (let i = 0; i < engine.player.flames; i++) flameText += '🔥';
      if (engine.player.flames === 0) flameText = '💀';
      elFlames.innerHTML = `<span class="flames-icon">${flameText}</span>`;

      // Carried
      elCarried.innerHTML = `<span>🏮 ${engine.player.carried} / ${engine.tuning.carry_capacity}</span>`;

      // Lanterns
      const litCount = engine.lanterns.filter(l => l.lit).length;
      elLanterns.innerHTML = `<span>${litCount} / ${engine.lanterns.length}</span>`;

      // Time & Score
      elTime.innerText = `${Math.ceil(engine.time_left_s)}s`;
      elScore.innerText = `${engine.score} pts`;

      // Game Over check
      if (engine.state !== 'playing' && modalOverlay.style.display !== 'flex') {
        modalOverlay.style.display = 'flex';
        modalScore.innerText = `Tổng Điểm: ${engine.score}`;
        if (engine.state === 'won') {
          modalTitle.className = 'modal-title won';
          modalTitle.innerText = 'Chiến Thắng!';
          modalDesc.innerText = 'Tất cả Đèn Lồng Lớn đã bừng sáng, xua tan sương đen trên Đảo Bến!';
        } else {
          modalTitle.className = 'modal-title lost';
          modalTitle.innerText = 'Trò Chơi Kết Thúc';
          if (engine.player.flames <= 0) {
            modalDesc.innerText = 'Mây đã bị Bóng Mực dập tắt hết ngọn lửa sinh mệnh.';
          } else {
            modalDesc.innerText = 'Bình minh đã đến trước khi bạn kịp thắp sáng các ngọn đèn.';
          }
        }
      }
    }, 100);
  </script>
</body>
</html>
